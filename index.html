:root{--bg:#f5f1e6;--cd:#fff;--tx:#14231f;--mu:#6b7a74;--g:#0b3b33;--au:#c9a227;--bd:#e0d9c5;--rd:#b3261e;--ok:#1b7a43;box-sizing:border-box;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}

button{background:var(--g);color:#fff;border:0;border-radius:8px;padding:9px 12px;cursor:pointer}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(105px,1fr));gap:8px}

.cd{background:var(--cd);border:1px solid var(--bd);border-radius:10px;padding:10px;margin:6px 0}

.wrap{overflow-x:auto}.k{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.k div{background:var(--cd);border:1px solid var(--bd);border-radius:10px;padding:8px}.k b{display:block;font-size:18px}

QRCode.PAD0 = 0xEC;
QRCode.PAD1 = 0x11;

QRCode.createData = function(typeNumber, errorCorrectLevel, dataList) {
	
	var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, errorCorrectLevel);
	
	var buffer = new QRBitBuffer();
	
	for (var i = 0; i < dataList.length; i++) {
		var data = dataList[i];
		buffer.put(data.mode, 4);
		buffer.put(data.getLength(), QRUtil.getLengthInBits(data.mode, typeNumber) );
		data.write(buffer);
	}

	var totalDataCount = 0;
	for (var x = 0; x < rsBlocks.length; x++) {
		totalDataCount += rsBlocks[x].dataCount;
	}

	if (buffer.getLengthInBits() > totalDataCount * 8) {
		throw new Error("code length overflow. (" + 
            buffer.getLengthInBits() + 
            ">" +  
            totalDataCount * 8 + 
            ")");
	}

	if (buffer.getLengthInBits() + 4 <= totalDataCount * 8) {
		buffer.put(0, 4);
	}

	while (buffer.getLengthInBits() % 8 !== 0) {
		buffer.putBit(false);
	}

	while (true) {
		
		if (buffer.getLengthInBits() >= totalDataCount * 8) {
			break;
		}
		buffer.put(QRCode.PAD0, 8);
		
		if (buffer.getLengthInBits() >= totalDataCount * 8) {
			break;
		}
		buffer.put(QRCode.PAD1, 8);
	}

	return QRCode.createBytes(buffer, rsBlocks);
};

QRCode.createBytes = function(buffer, rsBlocks) {

	var offset = 0;
	
	var maxDcCount = 0;
	var maxEcCount = 0;
	
	var dcdata = new Array(rsBlocks.length);
	var ecdata = new Array(rsBlocks.length);
	
	for (var r = 0; r < rsBlocks.length; r++) {

		var dcCount = rsBlocks[r].dataCount;
		var ecCount = rsBlocks[r].totalCount - dcCount;

		maxDcCount = Math.max(maxDcCount, dcCount);
		maxEcCount = Math.max(maxEcCount, ecCount);
		
		dcdata[r] = new Array(dcCount);
		
		for (var i = 0; i < dcdata[r].length; i++) {
			dcdata[r][i] = 0xff & buffer.buffer[i + offset];
		}
		offset += dcCount;
		
		var rsPoly = QRUtil.getErrorCorrectPolynomial(ecCount);
		var rawPoly = new QRPolynomial(dcdata[r], rsPoly.getLength() - 1);

		var modPoly = rawPoly.mod(rsPoly);
		ecdata[r] = new Array(rsPoly.getLength() - 1);
		for (var x = 0; x < ecdata[r].length; x++) {
            var modIndex = x + modPoly.getLength() - ecdata[r].length;
			ecdata[r][x] = (modIndex >= 0)? modPoly.get(modIndex) : 0;
		}

	}
	
	var totalCodeCount = 0;
	for (var y = 0; y < rsBlocks.length; y++) {
		totalCodeCount += rsBlocks[y].totalCount;
	}

	var data = new Array(totalCodeCount);
	var index = 0;

	for (var z = 0; z < maxDcCount; z++) {
		for (var s = 0; s < rsBlocks.length; s++) {
			if (z < dcdata[s].length) {
				data[index++] = dcdata[s][z];
			}
		}
	}

	for (var xx = 0; xx < maxEcCount; xx++) {
		for (var t = 0; t < rsBlocks.length; t++) {
			if (xx < ecdata[t].length) {
				data[index++] = ecdata[t][xx];
			}
		}
	}

	return data;

};

function kitem(id,i){const kk=KQ.find(x=>x.id==id);if(!kk)return;const dt=Date.now();kk.dn=Object.assign({},kk.dn);kk.dn[i]=dt;KDN[id]=Object.assign({},KDN[id],kk.dn);const all=kk.it.every((_,j)=>kk.dn[j]);(S.kq||[]).forEach(k=>{if(k.id==id){k.dn=Object.assign({},kk.dn);if(all)k.st='done'}});if(all)KQ=KQ.filter(k=>k.id!=id);if(kk.ok)kmark(kk.ok,id,kk.dn);save();kwrite(id,kk,all,dt,0);render()}
function kitemOld(id,i){const kk=KQ.find(x=>x.id==id);if(!kk)return;const dt=Date.now();kk.dn=Object.assign({},kk.dn);kk.dn[i]=dt;const all=kk.it.every((_,j)=>kk.dn[j]);(S.kq||[]).forEach(k=>{if(k.id==id){k.dn=Object.assign({},kk.dn);if(all)k.st='done'}});if(all)KQ=KQ.filter(k=>k.id!=id);if(kk.ok)kmark(kk.ok,id,kk.dn);save();try{window.claude&&claude.use('db').then(d=>d&&d.doc('kot/'+id).update(all?{dn:kk.dn,st:'done',dt:dt}:{dn:kk.dn})).catch(()=>{})}catch(e){}render()}
function kds(){const L=KQ.map(k=>({k,P:k.it.map((x,i)=>[x,i]).filter(([x,i])=>!(k.dn&&k.dn[i]))})).filter(z=>z.P.length).sort((a,b)=>a.k.t-b.k.t);return `<main class=kmain style="max-width:1600px"><div style="display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:nowrap;margin:0 0 2mm"><span style="font-size:22px;font-weight:700;color:var(--au);white-space:nowrap">Kitchen Orders (${L.length})</span><div class=nav style="display:flex;width:auto;flex:none;overflow:visible"><button class=klk title=Lock style="min-width:0" onclick="lockS();stopK();ok=0;ROLE='a';render()">${ic('lock')}<span>Lock</span></button></div></div><div class=kkg>${L.map(({k,P})=>`<div class="kk ${/^Take/i.test(k.l)?'kt-ta':/^Deliv/i.test(k.l)?'kt-dl':'kt-tb'} ${k.nw?'':'kad'}"><div class=kkh><span class=kkc><svg width=28 height=28 viewBox="0 0 24 24" fill=none stroke="#f7b500" stroke-width=2 stroke-linecap=round stroke-linejoin=round><path d="M3 18h18M5 18a7 7 0 0114 0M12 8V6M10 6h4"/></svg></span><span class=kkt>${esc(k.l).replace(/(\d+)/,'<em>$1</em>')}</span>${k.by?`<span class=kkp><svg width=14 height=14 viewBox="0 0 24 24" fill=none stroke="currentColor" stroke-width=2 stroke-linecap=round><circle cx=12 cy=8 r=4 /><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg> ${esc(k.by)}</span>`:''}<span class=kkr><svg width=18 height=18 viewBox="0 0 24 24" fill=none stroke="#f7b500" stroke-width=2 stroke-linecap=round><circle cx=12 cy=12 r=9 /><path d="M12 7v5l3 2"/></svg>#${k.no} · ${new Date(k.t).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})}${k.nw?'':' · ADD-ON'}</span></div>${P.map(([x,i])=>`<div class=kki2><span class=kkn><b>${x[0]} ×</b> ${esc(x[1])}<div class=kkw>${spv(x[2])==1?'':spb(x[2])}${nbd(x[3])}</div></span><span class="kkb${Date.now()-k.t>=900000?' kl':''}"><span class=kkm>${tmh(k.t,'⏱ ')}</span><button class=kkrd onclick="kitem('${k.id}',${i})">✔ Ready</button></span></div>`).join('')}${k.note?`<div class=kkx>Note: ${esc(k.note)}</div>`:''}</div>`).join('')||'<p style="text-align:center;opacity:.7">No pending orders</p>'}</div></main>`}

/* ===== Customer Order mode ===== */
var CLP='',CMY={};
function custStart(){CMY={};ROLE='c';WN='Customer';ok=1;V='home';H='T';cur=0;CLP='';render();window.scrollTo(0,0)}
function custExit(){CMY={};mod();ROLE='a';WN='Admin';ok=0;cur=0;CLP='';render()}
const custH=()=>`<header><div style="display:flex;align-items:center;justify-content:space-between;width:100%;gap:8px">${cur?`<button onclick="cur=0;mod();render();window.scrollTo(0,0)" style="padding:8px 12px">← Tables</button>`:`<button onclick="custExit()" style="padding:8px 12px">← Exit</button>`}<img src="${LOGO}" alt=""><b style="color:var(--au);font-size:17px;flex:1;text-align:right">${cur?lab(cur):'Customer Order'}</b></div></header>`;
const custTables=()=>`<h3 class=sec>Select Your Table<i class=dm></i></h3><div class=grid>${Array.from({length:15},(_,i)=>{const k='T'+(i+1),o=S.o[k],b=o&&o.items.length;const bl=b&&!CMY[k];return`<button class="t${b?' on':''}" style="--c:${PAL[i%PAL.length]};${bl?'opacity:.4;filter:grayscale(.7)':''}" onclick="cOpen('${k}')">${ic('table')}<span><b>${lab(k)}</b>${bl?'<br><small>Occupied</small>':''}</span></button>`}).join('')}</div><button onclick="cUnk()" style="display:flex;align-items:center;justify-content:center;gap:10px;width:100%;margin-top:18px;padding:16px 12px;border-radius:16px;border:1.5px solid #ffd75a;background:linear-gradient(135deg,rgba(201,154,46,.28),rgba(8,42,35,.9));color:#ffe9a8;font-weight:800;font-size:16px;letter-spacing:.3px;box-shadow:0 0 16px rgba(201,154,46,.45),inset 0 0 10px rgba(255,215,90,.15)"><span style="font-size:22px">❓</span><span>I don't know my table number</span></button>`;
function cOpen(k){const o=S.o[k];if(o&&o.items.length&&!CMY[k])return toast('This table is already occupied. Please ask our staff.');CMY[k]=1;op(k)}
function cUnk(){let n=1;while(S.o['TU'+n]&&S.o['TU'+n].items.length)n++;CMY['TU'+n]=1;op('TU'+n)}
const cbar=()=>{const o=S.o[cur];if(!o)return'';const it=o.items,n=it.reduce((a,x)=>a+x.q,0),pend=it.some(x=>x.q>x.s),b='flex:1;min-width:0;padding:12px 4px;border-radius:14px;font-weight:800;font-size:14px;color:#fff;border:2px solid ';return`<div class=bar id=bar style="flex-direction:column;align-items:stretch;gap:8px"><div style="text-align:center;font-weight:700">${n} items • AED ${f(tot(it).t)}</div><div style="display:flex;gap:6px"><button onclick="cPlace()" style="${b}#8be63a;background:linear-gradient(180deg,#17a34a,#095a1a);${pend?'':'opacity:.55'}">✔ Place Order</button><button onclick="cart()" style="${b}#38bdf8;background:linear-gradient(180deg,#1d4ed8,#0a2a94)">🧾 View Order</button><button onclick="cLoy()" style="${b}#ffd75a;background:linear-gradient(180deg,#c99a2e,#7a5a10)">⭐ Loyalty</button></div></div>`};
function cPlace(){const o=S.o[cur];if(!o||!o.items.some(x=>x.q>x.s))return toast('Please add items first');cfm('Place order for '+lab(cur)+'?',cKot)}
function cKot(){const o=S.o[cur];if(!o)return;const n=o.items.filter(x=>x.q>x.s);if(!n.length)return;S.kot++;const k={no:S.kot,ok:cur,by:'Customer',l:lab(cur),nw:!o.kn,t:Date.now(),it:n.map(x=>[x.q-x.s,x.n,spv(x.sp),x.nt==null?2:x.nt]),note:o.note||''};if(!o.by)o.by=k.by;klog(o,n,k);o.kn=(o.kn||0)+1;o.ks=(o.ks||[]).concat([{id:String(k.t),t:k.t,it:k.it}]);n.forEach(x=>x.s=x.q);save();const l=lab(cur);cur=0;mod();render();window.scrollTo(0,0);pushK(k);toast('Order placed for '+l+' ✔')}
function cLoy(){const k=CLP&&cfk(CLP),c=k&&S.cust[k],pt=c?cpts(k):0;mod(`<div class=row><b>⭐ Royal Loyalty</b><button class=s onclick="mod()">Close</button></div><p style="margin:8px 0"><small>Earn 5 points on every AED 10 · 100 points = AED 10 off</small></p><input class=pin id=lph type=tel placeholder="Mobile number" value="${esc(CLP)}"><button style="width:100%;margin-top:8px;padding:12px" onclick="CLP=$('#lph').value.replace(/\\s+/g,'');cLoy()">Check Points</button>${CLP?(c?`<div class=cd style="margin-top:10px;text-align:center"><b>${esc(c.n||'Customer')}</b><br><span style="font-size:34px;font-weight:800;color:var(--au)">${pt}</span><br><small>points${pt>=100?' · Ask staff to redeem 100 points = AED 10 off at billing':' · '+(100-pt)+' more points to reach 100'}</small></div>`:`<div class=cd style="margin-top:10px"><small>New customer — join Royal Loyalty</small><div class=row style="gap:6px;margin-top:6px"><input id=lnm placeholder="Your name" style="flex:1"><button onclick="cLoyNew()">Join</button></div></div>`):''}`)}
function cLoyNew(){const n=$('#lnm').value.trim();if(!n)return alert('Enter your name');if(ckd(CLP).length<7)return alert('Enter a valid mobile number');S.cust[CLP]={n,a:'',l:'',ts:Date.now()};save();cLoy()}

/* ===== Table QR codes ===== */
function qrIn(){const m=/^#T(\d{1,2})$/i.exec(location.hash);if(!m||+m[1]<1||+m[1]>15)return 0;const k='T'+(+m[1]);ROLE='c';WN='Customer';ok=1;V='home';H='T';CMY={};CMY[k]=1;CLP='';S.o[k]=S.o[k]||{items:[],note:''};cur=k;cat='All';sub='All';q='';return 1}
function tqM(u){const b=String(u||location.href).split('#')[0].trim();window.TQB=b;mod(`<div class=row><b>Table QR Codes</b><button class=s onclick="mod()">Close</button></div><p style="margin:8px 0"><small>Link of this POS that customers can open. Check / paste it below, then print.</small></p><input id=tqu value="${esc(b)}" onchange="tqM(this.value)"><button style="width:100%;margin:8px 0;padding:12px" onclick="tqP()">Print all 15 QR</button><div style="display:grid;grid-template-columns:repeat(3,1fr);gap:6px">${Array.from({length:15},(_,i)=>`<div class=cd style="text-align:center;padding:6px"><b>Table ${i+1}</b>${qrH(b+'#T'+(i+1),96)}</div>`).join('')}</div>`)}
function tqP(){const b=window.TQB||location.href.split('#')[0];prt(Array.from({length:15},(_,i)=>`<div style="text-align:center;page-break-after:always;padding:6px"><img src="${LOGO}" width=70><br><b style="font-size:16px">${NAME}</b><br><b style="font-size:26px">Table ${i+1}</b>${qrH(b+'#T'+(i+1),220)}<b style="font-size:15px">Scan to Order</b></div>`).join(''))}
addEventListener('hashchange',()=>{if(qrIn())render()});

const home=()=>{const h=H||'T';return tabs(h)+(h=='R'?runV():grp(h,{T:15,A:10,D:10}[h],{T:'Tables',A:'Take Away',D:'Delivery'}[h]))+(ROLE=='a'?portals():'')};

const MN=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const lastM=n=>{const d=new Date(),o=[];for(let i=n-1;i>=0;i--){const x=new Date(d.getFullYear(),d.getMonth()-i,1);o.push({k:x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0'),l:MN[x.getMonth()]})}return o};
const shortN=v=>v>=1000?(Math.round(v/100)/10)+'k':String(Math.round(v));
const mchart=(title,tot,col)=>{const ms=lastM(6),vs=ms.map(m=>tot[m.k]||0),mx=Math.max(1,...vs);return`<h3>${title}</h3><div class=cd><div style="display:flex;align-items:flex-end;gap:8px;height:150px">${ms.map((m,i)=>`<div style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%"><small style="font-size:11px;margin-bottom:3px">${vs[i]?shortN(vs[i]):''}</small><div style="width:100%;height:${Math.max(3,Math.round(vs[i]/mx*105))}px;background:${i==ms.length-1?col:col+'88'};border-radius:6px 6px 0 0"></div></div>`).join('')}</div><div style="display:flex;gap:8px;margin-top:4px">${ms.map((m,i)=>`<div style="flex:1;text-align:center;font-size:12px;${i==ms.length-1?'font-weight:700':'opacity:.8'}">${m.l}</div>`).join('')}</div></div>`};
const dchart=(title,tot,col)=>{const now=new Date(),y=now.getFullYear(),mi=now.getMonth(),td=now.getDate(),n=new Date(y,mi+1,0).getDate(),ks=[];for(let d=1;d<=n;d++)ks.push({d,k:y+'-'+String(mi+1).padStart(2,'0')+'-'+String(d).padStart(2,'0')});const vs=ks.map(x=>tot[x.k]||0),mx=Math.max(1,...vs),im=vs.indexOf(Math.max(...vs)),sm=vs.reduce((a,b)=>a+b,0);return`<h3>${title} — ${MN[mi]}</h3><div class=cd><div style="display:flex;align-items:flex-end;gap:2px;height:150px">${ks.map((x,i)=>`<div style="flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%"><small style="font-size:9px;margin-bottom:2px;white-space:nowrap;height:11px">${vs[i]&&i==im?shortN(vs[i]):''}</small><div style="width:100%;height:${vs[i]?Math.max(3,Math.round(vs[i]/mx*105)):2}px;background:${x.d==td?col:col+(vs[i]?'aa':'44')};border-radius:3px 3px 0 0"></div></div>`).join('')}</div><div style="display:flex;gap:2px;margin-top:4px">${ks.map(x=>`<div style="flex:1;min-width:0;text-align:center;font-size:9px;${x.d==td?'font-weight:700;color:'+col:'opacity:.75'}">${x.d==1||x.d%5==0||x.d==td?x.d:''}</div>`).join('')}</div><div class=row style="margin-top:8px"><small>Total</small><b>${f(sm)}</b></div></div>`};
const amtRows=(rows,col)=>{const mx=Math.max(1,...rows.map(r=>r[1]));return rows.map(([n,v])=>`<div class=cd style="margin:5px 0"><div class=row><span>${esc(n)}</span><b>${f(v)}</b></div><div style="height:5px;border-radius:3px;background:var(--bd);margin-top:6px"><div style="height:5px;border-radius:3px;width:${Math.round(v/mx*100)}%;background:${col}"></div></div></div>`).join('')};
const expChart=()=>{const mo=ymd(Date.now()).slice(0,7),tot={},cat={};S.exp.forEach(x=>{tot[x.d]=(tot[x.d]||0)+x.a;if(x.d.slice(0,7)==mo)cat[x.c]=(cat[x.c]||0)+x.a});const rows=Object.entries(cat).sort((a,b)=>b[1]-a[1]);return dchart('Day wise Expenses',tot,'#ff6b81')+`<h3>Category wise — ${MN[+mo.slice(5)-1]}</h3>`+(rows.length?amtRows(rows,'#ff6b81'):'<p style="opacity:.7">No expenses this month</p>')};
const salesChart=()=>{const mo=ymd(Date.now()).slice(0,7),tot={},M=S.sales.filter(x=>x.d.slice(0,7)==mo);S.sales.forEach(x=>{tot[x.d]=(tot[x.d]||0)+x.t});const rows=[['Cash',sum(M,'c')],['Card',sum(M,'k')]].concat(['Smiles','Deliveroo','Keeta','Noon','Careem'].map(p=>[p,sum(M.filter(x=>x.m==p),'t')]));return dchart('Day wise Sales',tot,'#d4a72c')+`<h3>Payment wise — ${MN[+mo.slice(5)-1]}</h3>`+amtRows(rows,'#d4a72c')};
